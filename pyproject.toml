[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lightyear"
version = "0.1.0"
description = "Ingest a spatial omics dataset into a queryable store + dataset card, and expose it to an LLM agent via MCP"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10",
  "h5py",
  "numpy",
  "pandas",
  "pyarrow",
  "scipy",
  "scikit-learn",
  "threadpoolctl",
  "matplotlib",
  "pyyaml",
  "mcp>=2.2",
]

[project.optional-dependencies]
test = ["pytest"]
gui = ["claude-agent-sdk", "fastapi", "uvicorn[standard]"]

[project.scripts]
lightyear = "lightyear.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lightyear = ["gui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
