<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lightyear</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">✦</span> Lightyear
      <span class="tagline">Learns, Interrogates, Generates Hypotheses, Tests, Yields Evidence And Refutations</span>
    </div>
    <div class="controls">
      <select id="dataset" aria-label="dataset"></select>
      <button id="newchat" title="Start a new conversation">New chat</button>
      <span id="status" class="status">connecting…</span>
    </div>
  </header>

  <main>
    <section id="chatpane">
      <div id="chat">
        <div id="welcome" class="welcome">
          <h2 id="ds-title"></h2>
          <p id="ds-desc"></p>
          <div id="examples" class="examples"></div>
        </div>
      </div>
      <form id="ask">
        <textarea id="input" rows="2" placeholder="Ask about this dataset…  (Enter to send, Shift+Enter for a new line)"></textarea>
        <button id="send" type="submit">Ask</button>
        <button id="stop" type="button" hidden>Stop</button>
      </form>
    </section>

    <aside id="side">
      <nav class="tabs">
        <button data-tab="claims" class="active">Claims</button>
        <button data-tab="findings">Findings</button>
        <button data-tab="card">Dataset card</button>
      </nav>
      <div id="tab-claims" class="tab active"></div>
      <div id="tab-findings" class="tab md"></div>
      <div id="tab-card" class="tab md"></div>
    </aside>
  </main>

  <dialog id="claimdlg">
    <button class="close" onclick="this.closest('dialog').close()">×</button>
    <div id="claimbody" class="md"></div>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
